<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚀</text></svg>"
    />
    <title>Свій продукт — навчальна симуляція</title>
    <meta
      name="description"
      content="Піксельна навчальна гра про соло-розробника, який будує SaaS на бутстрапі: валідація, воронка, юніт-економіка, вигорання — 36 місяців від ідеї до зарплати."
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__title">Свій продукт</span>
          <span class="topbar__month" id="month-name"></span>
        </div>
        <div class="topbar__tools">
          <span class="topbar__mrr" id="mrr"></span>
          <button type="button" class="btn" id="codex-btn">Довідник</button>
          <button type="button" class="btn btn--ghost" id="restart-btn">Почати заново</button>
        </div>
      </header>

      <main class="layout">
        <section class="scene" id="scene" aria-label="Робоче місце"></section>
        <section class="panel" id="panel"></section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
